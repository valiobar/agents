# Dev override: hot reload and extra host ports for internal services.
# Do not publish MongoDB, Redis, or ChromaDB. Host 27017 and 8000 are
# already taken on the shared droplet by vbar-viber-bot.
# Gateway and frontend host ports come from docker-compose.yml (8010 and 3010).

services:
  auth:
    ports:
      - "8001:8001"
    volumes:
      - ./services/auth/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    develop:
      watch:
        - action: sync
          path: ./services/auth/app
          target: /app/app
        - action: rebuild
          path: ./services/auth/requirements.txt
        - action: rebuild
          path: ./services/auth/Dockerfile

  business:
    ports:
      - "8005:8005"
    volumes:
      - ./services/business/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8005 --reload
    develop:
      watch:
        - action: sync
          path: ./services/business/app
          target: /app/app
        - action: rebuild
          path: ./services/business/requirements.txt
        - action: rebuild
          path: ./services/business/Dockerfile

  gateway:
    volumes:
      - ./gateway/app:/app/app
    environment:
      - RATE_LIMIT_PER_HOUR=10000
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    develop:
      watch:
        - action: sync
          path: ./gateway/app
          target: /app/app
        - action: rebuild
          path: ./gateway/requirements.txt
        - action: rebuild
          path: ./gateway/Dockerfile

  agent:
    ports:
      - "8002:8002"
    volumes:
      - ./services/agent/app:/app/app
    environment:
      - AGENT_ENV=development
      - OPENAI_CHAT_MODEL=gpt-4.1-mini
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload
    develop:
      watch:
        - action: sync
          path: ./services/agent/app
          target: /app/app
        - action: rebuild
          path: ./services/agent/requirements.txt
        - action: rebuild
          path: ./services/agent/Dockerfile

  knowledge:
    ports:
      - "8003:8003"
    volumes:
      - ./services/knowledge/app:/app/app
      - ./data/knowledgebase/tax:/app/data/knowledgebase/tax:ro
    environment:
      - PRELOAD_TAX_DOCS=false
    command: uvicorn app.main:app --host 0.0.0.0 --port 8003 --reload
    develop:
      watch:
        - action: sync
          path: ./services/knowledge/app
          target: /app/app
        - action: rebuild
          path: ./services/knowledge/requirements.txt
        - action: rebuild
          path: ./services/knowledge/Dockerfile

  orchestrator:
    ports:
      - "8004:8004"
    volumes:
      - ./services/orchestrator/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8004 --reload
    develop:
      watch:
        - action: sync
          path: ./services/orchestrator/app
          target: /app/app
        - action: rebuild
          path: ./services/orchestrator/requirements.txt
        - action: rebuild
          path: ./services/orchestrator/Dockerfile

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: deps
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    command: npm run dev -- --hostname 0.0.0.0
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - WATCHPACK_POLLING=true
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/
            - .next/
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json
        - action: rebuild
          path: ./frontend/Dockerfile

volumes:
  frontend_node_modules:
  frontend_next:
